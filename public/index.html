<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sivree" />
    <!-- 読み込めるものを自分のサイトのファイルだけに絞る（画像は https のもののみ）。インラインのスクリプトは使わない -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-src https://accounts.google.com; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <title>Sivree</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sivree" />
    <meta property="og:image" content="https://ty-knowgic.github.io/sivree-app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar-row">
        <button id="backButton" class="nav-back" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          <span data-i18n="戻る">戻る</span>
        </button>

        <a id="brand" class="brand" href="#/">
          <span id="today" class="brand-date"></span>
          <span class="brand-title">
            <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="M36 16H19V84H36M64 16H81V84H64" /><circle cx="50" cy="50" r="12" /></svg>
            <span class="brand-name" lang="en">Sivree</span>
          </span>
        </a>

        <div class="appbar-actions">
          <button id="syncButton" class="icon-button sync-button" type="button" data-i18n-aria="今すぐ同期" aria-label="今すぐ同期" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-14.3 4.9" /><path d="M4 12a8 8 0 0 1 14.3-4.9" /><path d="M18.5 3v4.2h-4.2" /><path d="M5.5 21v-4.2h4.2" /></svg>
          </button>
          <button id="saveButton" class="icon-button" type="button" data-i18n-aria="保存" aria-label="保存" aria-pressed="false" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" /></svg>
          </button>
          <button id="shareButton" class="icon-button" type="button" data-i18n-aria="共有" aria-label="共有" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12" /><path d="M8 7l4-4 4 4" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" /></svg>
          </button>
          <button id="savedButton" class="icon-button" type="button" data-i18n-aria="保存した記事" aria-label="保存した記事">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z" /></svg>
            <span id="savedCount" class="icon-badge" aria-hidden="true" hidden>0</span>
          </button>
          <button id="settingsButton" class="icon-button" type="button" data-i18n-aria="設定" aria-label="設定">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h4"/><path d="M12 17h8"/><circle cx="10" cy="17" r="2"/></svg>
          </button>
          <button id="searchToggle" class="icon-button" type="button" data-i18n-aria="検索" aria-label="検索" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
          </button>
        </div>
      </div>

      <div id="searchBar" class="search-bar" hidden>
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
          <input id="keywordInput" type="search" data-i18n-placeholder="キーワード・#タグで検索" placeholder="キーワード・#タグで検索" enterkeyhint="search" autocomplete="off" />
        </div>
      </div>

      <nav id="tabs" class="tabs" role="tablist" data-i18n-aria="カテゴリ" aria-label="カテゴリ"></nav>
    </header>

    <main>
      <section id="listView" class="list-view">
        <div class="list-toolbar">
          <div class="filters">
            <label class="region-chip">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18" /><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18" /></svg>
              <span class="visually-hidden" data-i18n="地域">地域</span>
              <select id="subgroupFilter">
                <option value="" data-i18n="すべての地域">すべての地域</option>
              </select>
            </label>
            <label class="region-chip">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V8l8-5 8 5v13" /><path d="M9 21v-6h6v6" /></svg>
              <span class="visually-hidden" data-i18n="発信元">発信元</span>
              <select id="sourceTypeFilter">
                <option value="" data-i18n="すべての発信元">すべての発信元</option>
              </select>
            </label>
          </div>
          <span id="status" class="status" aria-live="polite">読み込み中…</span>
        </div>

        <div id="newsList" class="news-list"></div>
        <div id="listEnd" class="list-end" aria-hidden="true"></div>
        <button id="moreButton" class="more-button" type="button" hidden data-i18n="さらに読み込む">さらに読み込む</button>
        <p id="endNote" class="end-note" hidden data-i18n="ここまでです。新しい発表があると、ここに追加されます。">ここまでです。新しい発表があると、ここに追加されます。</p>
      </section>

      <article id="detailView" class="detail-view" hidden></article>

      <section id="settingsView" class="settings-view" hidden></section>

      <section id="savedView" class="saved-view" hidden></section>

      <section id="onboardingView" class="onboarding" hidden></section>
    </main>

    <script src="i18n.js"></script>
    <script src="saved.js"></script>
    <script src="sync.js"></script>
    <script src="app.js"></script>
  </body>
</html>
