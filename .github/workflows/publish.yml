# 数時間おきに一次情報を集めて、静的サイト（GitHub Pages）を更新する。サーバーは不要。
name: Publish Sivry

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check:locales

      # コードに書いた文言と、情報源の名前・説明が、すべて辞書にあることを確かめる
      - run: npm run check:i18n-keys
      - run: npm run check:source-names
      # 敵意のあるフィードの内容を描画しても、スクリプトが実行されないことを確かめる
      - run: npm run test:xss

      # Google ドライブ同期の判断（送信・取り込み・競合）を、偽のドライブで確かめる
      - run: npm run test:sync

      # 「新着」の印と「ここまで」の表示を確かめる
      - run: npm run test:visit

      # 初回の質問（地域・分野・テーマ）の流れと、選んだテーマの保存を確かめる
      - run: npm run test:onboarding

      # ハッシュタグが表示言語に合わせて訳されることを確かめる
      - run: npm run test:hashtags

      # ロゴ・しばらくぶりの復帰でデータを読み直すことを確かめる
      - run: npm run test:refresh

      # フィード取得の取り直し・同時取得数の上限と、同じ記事の重複のまとめを確かめる
      - run: npm run test:feeds

      # 蓄積中の記事・要約・ベクトル（直近30日分）を前回から引き継ぐ。無い場合は、いまフィードにある記事から作り直す
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-

      # 意味による一致のための、小さなオープンソースの埋め込みモデル（外部の AI サービスは使わない）
      - name: Start the embedding model
        run: |
          # 版を固定して入れる（インストール用スクリプトは公式のもの。この実行環境には秘密情報を置いていない）。ネットワークの一時的な失敗に備えて3回まで試す
          installed=0
          for attempt in 1 2 3; do
            curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.40.5 sh && installed=1 && break
            sleep 15
          done
          [ "$installed" = 1 ] || { echo "ollama のインストールに失敗しました"; exit 1; }
          # systemd が使えない実行環境があるため、サーバーを自分で起動して応答を待つ。起動しなければ、やり直す（3回まで）
          started=0
          for attempt in 1 2 3; do
            curl -s localhost:11434/api/tags > /dev/null || (nohup ollama serve >> ollama.log 2>&1 &)
            for i in $(seq 1 45); do
              if curl -s localhost:11434/api/tags > /dev/null; then started=1; break; fi
              sleep 2
            done
            [ "$started" = 1 ] && break
            pkill -f "ollama serve" || true
            sleep 5
          done
          [ "$started" = 1 ] || { cat ollama.log; exit 1; }
          pulled=0
          for attempt in 1 2 3; do
            ollama pull embeddinggemma:300m && pulled=1 && break
            sleep 10
          done
          [ "$pulled" = 1 ] || { echo "モデルを取得できませんでした"; exit 1; }

      - name: Collect, summarize and embed
        run: npm run export
        env:
          REQUIRE_SEMANTIC: '1'

      - run: npm run build:site

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data
          key: state-${{ github.run_id }}

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # 公開リポジトリでは、60日間まったく動きがないと定期実行が止められるため、毎回有効化し直して延長する
      - name: Keep the schedule alive
        run: gh workflow enable publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
